name: Backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: changeguard
          POSTGRES_USER: changeguard
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changeguard -d changeguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHANGEGUARD_DB_URL: jdbc:postgresql://localhost:5432/changeguard
      CHANGEGUARD_DB_USER: changeguard
      CHANGEGUARD_DB_PASSWORD: ci-test-only
      SPRING_PROFILES_ACTIVE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test
        working-directory: backend
        run: mvn --batch-mode verify
