spring:
  application:
    name: changeguard-backend
  datasource:
    url: ${CHANGEGUARD_DB_URL:jdbc:postgresql://localhost:5432/changeguard}
    username: ${CHANGEGUARD_DB_USER:changeguard}
    password: ${CHANGEGUARD_DB_PASSWORD}
  flyway:
    enabled: true
server:
  address: 127.0.0.1
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
changeguard:
  github:
    enabled: ${CHANGEGUARD_GITHUB_ENABLED:false}
    app:
      enabled: ${CHANGEGUARD_GITHUB_APP_ENABLED:false}
      id: ${CHANGEGUARD_GITHUB_APP_ID:0}
      private-key-file: ${CHANGEGUARD_GITHUB_APP_PRIVATE_KEY_FILE:}
      bindings: '${CHANGEGUARD_GITHUB_APP_BINDINGS:{}}'
    webhooks:
      enabled: ${CHANGEGUARD_GITHUB_WEBHOOKS_ENABLED:false}
      secret: ${CHANGEGUARD_GITHUB_WEBHOOK_SECRET:}
  auth:
    issuer: ${CHANGEGUARD_AUTH_ISSUER:http://localhost:8080}
    frontend-url: ${CHANGEGUARD_FRONTEND_URL:http://localhost:3000}
    frontend-origins: ${CHANGEGUARD_FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
    redirect-uris: ${CHANGEGUARD_REDIRECT_URIS:http://localhost:3000/oauth/callback,http://localhost:5173/oauth/callback,http://127.0.0.1:5173/oauth/callback}
    signing-jwk: ${CHANGEGUARD_SIGNING_JWK:}
