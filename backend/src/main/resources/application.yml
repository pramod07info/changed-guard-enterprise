spring:
  application:
    name: changeguard-backend
  datasource:
    url: ${CHANGEGUARD_DB_URL:jdbc:postgresql://localhost:5432/changeguard}
    username: ${CHANGEGUARD_DB_USER:changeguard}
    password: ${CHANGEGUARD_DB_PASSWORD}
  flyway:
    enabled: true
server:
  address: 127.0.0.1
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
changeguard:
  features:
    normalized-analysis:
      enabled: ${CHANGEGUARD_FEATURE_NORMALIZED_ANALYSIS_ENABLED:true}
    open-api-analysis:
      enabled: ${CHANGEGUARD_FEATURE_OPEN_API_ANALYSIS_ENABLED:true}
    analysis-history:
      enabled: ${CHANGEGUARD_FEATURE_ANALYSIS_HISTORY_ENABLED:true}
    catalog:
      enabled: ${CHANGEGUARD_FEATURE_CATALOG_ENABLED:true}
    baselines:
      enabled: ${CHANGEGUARD_FEATURE_BASELINES_ENABLED:true}
    database-analysis:
      enabled: ${CHANGEGUARD_FEATURE_DATABASE_ANALYSIS_ENABLED:true}
    database-history:
      enabled: ${CHANGEGUARD_FEATURE_DATABASE_HISTORY_ENABLED:true}
    dependency-analysis:
      enabled: ${CHANGEGUARD_FEATURE_DEPENDENCY_ANALYSIS_ENABLED:true}
    test-recommendations:
      enabled: ${CHANGEGUARD_FEATURE_TEST_RECOMMENDATIONS_ENABLED:true}
    github-pr:
      enabled: ${CHANGEGUARD_FEATURE_GITHUB_PR_ENABLED:true}
    webhooks:
      enabled: ${CHANGEGUARD_FEATURE_WEBHOOKS_ENABLED:true}
    github-checks:
      enabled: ${CHANGEGUARD_FEATURE_GITHUB_CHECKS_ENABLED:true}
    metrics:
      enabled: ${CHANGEGUARD_FEATURE_METRICS_ENABLED:true}
  github:
    enabled: ${CHANGEGUARD_GITHUB_ENABLED:false}
    app:
      enabled: ${CHANGEGUARD_GITHUB_APP_ENABLED:false}
      id: ${CHANGEGUARD_GITHUB_APP_ID:0}
      private-key-file: ${CHANGEGUARD_GITHUB_APP_PRIVATE_KEY_FILE:}
      bindings: '${CHANGEGUARD_GITHUB_APP_BINDINGS:{}}'
    webhooks:
      enabled: ${CHANGEGUARD_GITHUB_WEBHOOKS_ENABLED:false}
      secret: ${CHANGEGUARD_GITHUB_WEBHOOK_SECRET:}
  auth:
    issuer: ${CHANGEGUARD_AUTH_ISSUER:http://localhost:8080}
    frontend-url: ${CHANGEGUARD_FRONTEND_URL:http://localhost:3000}
    frontend-origins: ${CHANGEGUARD_FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
    redirect-uris: ${CHANGEGUARD_REDIRECT_URIS:http://localhost:3000/oauth/callback,http://localhost:5173/oauth/callback,http://127.0.0.1:5173/oauth/callback}
    signing-jwk: ${CHANGEGUARD_SIGNING_JWK:}
