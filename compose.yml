services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
  backend:
    build: ./backend
    environment:
      CHANGEGUARD_DB_URL: jdbc:postgresql://postgres:5432/changeguard
      CHANGEGUARD_DB_USER: changeguard
      SPRING_PROFILES_ACTIVE: local
      CHANGEGUARD_FEATURE_NORMALIZED_ANALYSIS_ENABLED: ${CHANGEGUARD_FEATURE_NORMALIZED_ANALYSIS_ENABLED:-true}
      CHANGEGUARD_FEATURE_OPEN_API_ANALYSIS_ENABLED: ${CHANGEGUARD_FEATURE_OPEN_API_ANALYSIS_ENABLED:-true}
      CHANGEGUARD_FEATURE_ANALYSIS_HISTORY_ENABLED: ${CHANGEGUARD_FEATURE_ANALYSIS_HISTORY_ENABLED:-true}
      CHANGEGUARD_FEATURE_CATALOG_ENABLED: ${CHANGEGUARD_FEATURE_CATALOG_ENABLED:-true}
      CHANGEGUARD_FEATURE_BASELINES_ENABLED: ${CHANGEGUARD_FEATURE_BASELINES_ENABLED:-true}
      CHANGEGUARD_FEATURE_DATABASE_ANALYSIS_ENABLED: ${CHANGEGUARD_FEATURE_DATABASE_ANALYSIS_ENABLED:-true}
      CHANGEGUARD_FEATURE_DATABASE_HISTORY_ENABLED: ${CHANGEGUARD_FEATURE_DATABASE_HISTORY_ENABLED:-true}
      CHANGEGUARD_FEATURE_DEPENDENCY_ANALYSIS_ENABLED: ${CHANGEGUARD_FEATURE_DEPENDENCY_ANALYSIS_ENABLED:-true}
      CHANGEGUARD_FEATURE_TEST_RECOMMENDATIONS_ENABLED: ${CHANGEGUARD_FEATURE_TEST_RECOMMENDATIONS_ENABLED:-true}
      CHANGEGUARD_FEATURE_GITHUB_PR_ENABLED: ${CHANGEGUARD_FEATURE_GITHUB_PR_ENABLED:-true}
      CHANGEGUARD_FEATURE_WEBHOOKS_ENABLED: ${CHANGEGUARD_FEATURE_WEBHOOKS_ENABLED:-true}
      CHANGEGUARD_FEATURE_GITHUB_CHECKS_ENABLED: ${CHANGEGUARD_FEATURE_GITHUB_CHECKS_ENABLED:-true}
      CHANGEGUARD_FEATURE_METRICS_ENABLED: ${CHANGEGUARD_FEATURE_METRICS_ENABLED:-true}
      CHANGEGUARD_GITHUB_ENABLED: ${CHANGEGUARD_GITHUB_ENABLED:-false}
      CHANGEGUARD_GITHUB_APP_ENABLED: ${CHANGEGUARD_GITHUB_APP_ENABLED:-false}
      CHANGEGUARD_GITHUB_APP_ID: ${CHANGEGUARD_GITHUB_APP_ID:-0}
      CHANGEGUARD_GITHUB_APP_PRIVATE_KEY_FILE: ${CHANGEGUARD_GITHUB_APP_PRIVATE_KEY_FILE:-}
      CHANGEGUARD_GITHUB_APP_BINDINGS: '${CHANGEGUARD_GITHUB_APP_BINDINGS:-{}}'
      CHANGEGUARD_GITHUB_WEBHOOKS_ENABLED: ${CHANGEGUARD_GITHUB_WEBHOOKS_ENABLED:-false}
      CHANGEGUARD_GITHUB_WEBHOOK_SECRET: ${CHANGEGUARD_GITHUB_WEBHOOK_SECRET:-}
      CHANGEGUARD_AUTH_ISSUER: http://localhost:8080
      CHANGEGUARD_FRONTEND_URL: http://localhost:3000
      CHANGEGUARD_DB_PASSWORD: ${CHANGEGUARD_DB_PASSWORD:?Set CHANGEGUARD_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: changeguard
      POSTGRES_USER: changeguard
      POSTGRES_PASSWORD: ${CHANGEGUARD_DB_PASSWORD:?Set CHANGEGUARD_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changeguard -d changeguard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
